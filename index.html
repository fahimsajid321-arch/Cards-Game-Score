<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Score Tracker">
  <link rel="manifest" href="manifest.json">
  <title>Score Tracker</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f4f6f8; color: #222; }
    h2, h3 { margin-top: 0; }
    .card { background: #fff; padding: 18px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); margin-bottom: 20px; }
    input, textarea, button { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px; margin: 6px 0 12px 0; border: 1px solid #ccc; border-radius: 8px; }
    button { background: #007aff; color: white; border: none; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    .eliminated { color: #d9534f; font-weight: bold; }
    .active { color: #28a745; font-weight: bold; }
  </style>
</head>
<body>

  <div id="setup-view" class="card">
    <h2>🎯 Score Tracker Setup</h2>
    <label>Max Score (Elimination Threshold):</label>
    <input type="number" id="max-score" value="100">
    <label>Player Names (one per line):</label>
    <textarea id="player-names" rows="4">Alice&#10;Bob&#10;Charlie</textarea>
    <button onclick="startGame()">Start Game</button>
  </div>

  <div id="game-view" style="display:none;">
    <div class="card" id="input-card">
      <h3 id="round-title">Round 1 Scores</h3>
      <div id="round-inputs"></div>
      <button onclick="submitRound()">Submit Scores</button>
    </div>

    <div class="card">
      <h3>Leaderboard</h3>
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
      <button onclick="resetGame()" style="background:#6c757d; margin-top:15px;">New Game</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    let players = {};
    let maxScore = 100;
    let roundNum = 1;

    function startGame() {
      maxScore = parseInt(document.getElementById('max-score').value) || 100;
      const names = document.getElementById('player-names').value.split('\n').map(n => n.trim()).filter(n => n);
      if (names.length < 2) return alert('Enter at least 2 players');

      players = {};
      names.forEach(name => players[name] = []);
      roundNum = 1;

      document.getElementById('setup-view').style.display = 'none';
      document.getElementById('game-view').style.display = 'block';
      renderRoundInputs();
      renderLeaderboard();
    }

    function renderRoundInputs() {
      const container = document.getElementById('round-inputs');
      container.innerHTML = '';
      document.getElementById('round-title').innerText = `Round ${roundNum} Scores`;

      const active = Object.keys(players).filter(p => players[p].reduce((a,b)=>a+b, 0) < maxScore);

      if (active.length <= 1) {
        document.getElementById('input-card').innerHTML = active.length === 1 
          ? `<h3>🏆 Winner: ${active[0]}!</h3>` 
          : `<h3>⚠️ All players eliminated!</h3>`;
        return;
      }

      active.forEach(name => {
        const label = document.createElement('label');
        label.innerText = `${name}'s points:`;
        const input = document.createElement('input');
        input.type = 'number';
        input.id = `score-${name}`;
        input.value = 0;
        container.appendChild(label);
        container.appendChild(input);
      });
    }

    function submitRound() {
      const active = Object.keys(players).filter(p => players[p].reduce((a,b)=>a+b, 0) < maxScore);
      active.forEach(name => {
        const val = parseInt(document.getElementById(`score-${name}`).value) || 0;
        players[name].push(val);
      });
      roundNum++;
      renderRoundInputs();
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '';
      for (const [name, history] of Object.entries(players)) {
        const total = history.reduce((a, b) => a + b, 0);
        const isEliminated = total >= maxScore;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${name}</strong></td>
          <td>${total}</td>
          <td class="${isEliminated ? 'eliminated' : 'active'}">${isEliminated ? 'Eliminated' : 'Active'}</td>
        `;
        tbody.appendChild(tr);
      }
    }

    function resetGame() {
      document.getElementById('setup-view').style.display = 'block';
      document.getElementById('game-view').style.display = 'none';
    }
  </script>
</body>
</html>
